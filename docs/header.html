<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1280px;height:640px;overflow:hidden;background:radial-gradient(1200px 700px at 85% 30%,#1b2a4a 0%,#0d1117 55%,#090c10 100%);font-family:'JetBrainsMono NF','Fira Code',monospace;color:#e6edf3;position:relative}
.grid{position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:40px 40px}
.left{position:absolute;left:84px;top:118px;width:560px}
h1{font-size:128px;font-weight:800;letter-spacing:-4px;line-height:1}
h1 span{color:#f0883e}
.tag{margin-top:22px;font-size:25px;color:#9da7b3;line-height:1.45}
.stat{margin-top:48px;display:flex;align-items:baseline;gap:18px;font-size:44px;font-weight:700}
.old{color:#6e7681;text-decoration:line-through;text-decoration-thickness:3px}
.arrow{color:#6e7681;font-size:36px}
.new{color:#3fb950}
.note{margin-top:10px;font-size:18px;color:#6e7681}
.deck{position:absolute;right:92px;top:150px;width:470px;height:340px;border-radius:44px;background:linear-gradient(160deg,#2b2f36,#16191e);box-shadow:0 40px 80px #0009,inset 0 2px 0 #ffffff14;padding:44px 43px;display:grid;grid-template-columns:repeat(3,112px);gap:24px 32px}
.key{width:112px;height:112px;border-radius:18px;background:#000;box-shadow:inset 0 0 0 2px #ffffff10,0 6px 12px #0008;overflow:hidden;position:relative}
.key img{width:100%;height:100%;image-rendering:auto}
.ghost{display:flex;align-items:center;justify-content:center;font-size:14px;color:#484f58;letter-spacing:2px}
.ghost::before{content:"";position:absolute;inset:14px;border:2px dashed #30363d;border-radius:12px}
.cap{position:absolute;right:92px;top:512px;width:470px;text-align:center;font-size:17px;color:#6e7681}
</style></head><body><div class="grid"></div>
<div class="left"><h1>deck<span>d</span></h1>
<div class="tag">A tiny Rust daemon for the<br>Elgato Stream Deck Mini.</div>
<div class="stat"><span class="old">2.9 GB</span><span class="arrow">→</span><span class="new">3.5 MB</span></div>
<div class="note">RAM, after replacing StreamController</div></div>
<div class="deck">
<div class="key ghost">ghost</div><div class="key ghost">ghost</div><div class="key"><img src="../icons/iphone.png"></div>
<div class="key"><img src="../icons/s9.png"></div><div class="key"><img src="../icons/8a.png"></div><div class="key"><img src="../icons/fold.png"></div>
</div>
<div class="cap">one binary · one thread · no GUI · no delay</div>
</body></html>
